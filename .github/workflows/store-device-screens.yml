name: Vice Codes — Real device store screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-device-screens.yml'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  android-emulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Flutter Android project
        working-directory: mobile
        run: |
          flutter create --platforms=android,ios --org=de.smarbiz --project-name=vicecodes .
          flutter pub get
      - name: Capture screenshots on actual Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            cd mobile
            flutter build apk --debug
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n de.smarbiz.vicecodes/.MainActivity
            sleep 15
            mkdir -p store/screenshots/android
            adb exec-out screencap -p > store/screenshots/android/01-cheat-datenbank.png
            adb shell input tap 675 2210
            sleep 3
            adb exec-out screencap -p > store/screenshots/android/02-anleitung.png
            adb shell input tap 943 2210
            sleep 3
            adb exec-out screencap -p > store/screenshots/android/03-ueber-die-app.png
            file store/screenshots/android/*.png
      - name: Upload actual Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-android-emulator-screens
          path: mobile/store/screenshots/android/*.png
          retention-days: 14
          if-no-files-found: warn

  ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter and iPhone simulator
        working-directory: mobile
        run: |
          flutter create --platforms=ios --org=de.smarbiz --project-name=vicecodes .
          flutter pub get
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          out=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[d for lst in out["devices"].values() for d in lst if d.get("isAvailable") and "iPhone" in d["name"]]
          candidates.sort(key=lambda d: (("Pro Max" not in d["name"]),("Pro" not in d["name"]),d["name"]))
          if not candidates: raise SystemExit("No available iPhone simulator")
          print("SIMULATOR_UDID="+candidates[0]["udid"])
          print("SIMULATOR_NAME="+candidates[0]["name"])
          PY
          echo "Chosen simulator: $SIMULATOR_UDID"
      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time '9:41' --batteryState charged --batteryLevel 100 || true
      - name: Capture real iOS UI across 3 native tabs
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p store/screenshots/ios
          for config in '0 01-cheat-datenbank' '2 02-anleitung' '3 03-ueber-die-app'; do
            read -r tab filename <<< "$config"
            flutter build ios --simulator --debug --dart-define=VICE_CAPTURE_TAB="$tab"
            xcrun simctl terminate "$SIMULATOR_UDID" de.smarbiz.vicecodes || true
            xcrun simctl install "$SIMULATOR_UDID" build/ios/iphonesimulator/Runner.app
            xcrun simctl launch "$SIMULATOR_UDID" de.smarbiz.vicecodes
            sleep 10
            xcrun simctl io "$SIMULATOR_UDID" screenshot "store/screenshots/ios/$filename.png"
          done
          file store/screenshots/ios/*.png
      - name: Upload actual iPhone simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-ios-simulator-screens
          path: mobile/store/screenshots/ios/*.png
          retention-days: 14
          if-no-files-found: warn

  import-real-store-screenshots:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Follow the authorized emulator/simulator capture run
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            state=$(gh run view 44759343211 --repo hsdarestani/gtacheat --json status --jq .status)
            echo "Screenshot source run status: $state"
            if [ "$state" = "completed" ]; then break; fi
            sleep 15
          done
          test "$(gh run view 44759343211 --repo hsdarestani/gtacheat --json status --jq .status)" = "completed"
      - name: Retrieve images captured by real Flutter devices
        run: |
          mkdir -p incoming/android incoming/ios
          gh run download 44759343211 --repo hsdarestani/gtacheat \
            -n vice-codes-android-emulator-screens -D incoming/android || true
          gh run download 44759343211 --repo hsdarestani/gtacheat \
            -n vice-codes-ios-simulator-screens -D incoming/ios || true
          find incoming -type f -name '*.png' -print
      - name: Persist verified native screenshots in Publisher
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          audience = "https://publisher.smarbiz.sbs"
          token_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token_url += ("&" if "?" in token_url else "?") + urlencode({"audience": audience})
          req = Request(token_url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
          })
          with urlopen(req, timeout=25) as response:
              token = json.load(response)["value"]
          total = 0
          for platform in ("ios", "android"):
              files = sorted(Path("incoming", platform).rglob("*.png"))
              if not files:
                  print("No screenshots produced for " + platform)
                  continue
              for file in files:
                  try:
                      order = int(file.name[:2])
                  except ValueError:
                      raise SystemExit("Invalid screenshot file number " + file.name)
                  payload = {
                      "platform": platform,
                      "index": order,
                      "file": file.name,
                      "png_base64": base64.b64encode(file.read_bytes()).decode("ascii"),
                  }
                  req = Request(
                      audience + "/apps/automation/vice-codes-screenshot/",
                      data=json.dumps(payload).encode("utf-8"), method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "Mozilla/5.0 (compatible; APlusPublisher/1.0)",
                          "X-GitHub-OIDC": token,
                      },
                  )
                  try:
                      with urlopen(req, timeout=90) as response:
                          result = json.load(response)
                  except HTTPError as exc:
                      raise SystemExit("Publisher rejected " + file.name + ": HTTP " + str(exc.code) + " " + exc.read(800).decode("utf-8", "replace")) from None
                  if not result.get("ok"):
                      raise SystemExit("Screenshot upload failed: " + str(result))
                  print(platform, file.name, "asset", result.get("asset_id"), "saved", not result.get("reused"))
                  total += 1
          if total == 0:
              raise SystemExit("No real device screenshots were available; nothing was uploaded.")
          print("Stored native screenshot count: " + str(total))
          PY
