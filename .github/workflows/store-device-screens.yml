name: Vice Codes — Real device store screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-device-screens.yml'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  android-emulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Flutter Android project
        working-directory: mobile
        run: |
          flutter create --platforms=android,ios --org=de.smarbiz --project-name=vicecodes .
          flutter pub get
      - name: Capture screenshots on actual Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            cd mobile
            flutter build apk --debug
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n de.smarbiz.vicecodes/.MainActivity
            sleep 15
            mkdir -p store/screenshots/android
            adb exec-out screencap -p > store/screenshots/android/01-cheat-datenbank.png
            adb shell input tap 675 2210
            sleep 3
            adb exec-out screencap -p > store/screenshots/android/02-anleitung.png
            adb shell input tap 943 2210
            sleep 3
            adb exec-out screencap -p > store/screenshots/android/03-ueber-die-app.png
            file store/screenshots/android/*.png
      - name: Upload actual Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-android-emulator-screens
          path: mobile/store/screenshots/android/*.png
          retention-days: 14
          if-no-files-found: warn

  ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter and iPhone simulator
        working-directory: mobile
        run: |
          flutter create --platforms=ios --org=de.smarbiz --project-name=vicecodes .
          flutter pub get
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          out=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[d for lst in out["devices"].values() for d in lst if d.get("isAvailable") and "iPhone" in d["name"]]
          candidates.sort(key=lambda d: (("Pro Max" not in d["name"]),("Pro" not in d["name"]),d["name"]))
          if not candidates: raise SystemExit("No available iPhone simulator")
          print("SIMULATOR_UDID="+candidates[0]["udid"])
          print("SIMULATOR_NAME="+candidates[0]["name"])
          PY
          echo "Chosen simulator: $SIMULATOR_UDID"
      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time '9:41' --batteryState charged --batteryLevel 100 || true
      - name: Capture real iOS UI across 3 native tabs
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p store/screenshots/ios
          for config in '0 01-cheat-datenbank' '2 02-anleitung' '3 03-ueber-die-app'; do
            read -r tab filename <<< "$config"
            flutter build ios --simulator --debug --dart-define=VICE_CAPTURE_TAB="$tab"
            xcrun simctl terminate "$SIMULATOR_UDID" de.smarbiz.vicecodes || true
            xcrun simctl install "$SIMULATOR_UDID" build/ios/iphonesimulator/Runner.app
            xcrun simctl launch "$SIMULATOR_UDID" de.smarbiz.vicecodes
            sleep 10
            xcrun simctl io "$SIMULATOR_UDID" screenshot "store/screenshots/ios/$filename.png"
          done
          file store/screenshots/ios/*.png
      - name: Upload actual iPhone simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-ios-simulator-screens
          path: mobile/store/screenshots/ios/*.png
          retention-days: 14
          if-no-files-found: warn

  import-flutter-rendered-screenshots:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter web test build from identical native Dart UI
        working-directory: mobile
        run: |
          flutter create --platforms=web --org=de.smarbiz --project-name=vicecodes .
          flutter pub get
      - name: Install browser capture dependencies
        run: |
          python3 -m pip install --break-system-packages playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Capture authentic Flutter UI at Android phone resolution
        working-directory: mobile
        timeout-minutes: 13
        run: |
          set -euo pipefail
          for tab in 0 2 3; do
            echo "Compiling real Flutter UI for tab $tab"
            flutter build web --release --dart-define=VICE_CAPTURE_TAB=$tab
            python3 scripts/capture-web-ui-screens.py "$tab"
          done
      - name: Verify real Flutter-rendered Android PNG dimensions and content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=sorted(Path('mobile/store/screenshots/android').glob('*.png'))
          if len(files)<3: raise SystemExit('At least 3 actual Flutter UI screens required')
          for f in files:
              b=f.read_bytes()
              if not b.startswith(b'\x89PNG\r\n\x1a\n') or len(b)<20_000:
                  raise SystemExit('Not a valid screenshot: '+str(f))
              w,h=struct.unpack('>II',b[16:24])
              if (w,h)!=(1080,2400):
                  raise SystemExit('Incorrect actual Flutter screenshot dimensions: '+str(f)+' '+str((w,h)))
              print(str(f),w,h,len(b))
          PY
      - name: Save app-rendered Android screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-android-flutter-rendered-screens
          path: mobile/store/screenshots/android/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Upload Android screenshots to Publisher with scoped GitHub OIDC
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          audience='https://publisher.smarbiz.sbs'
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url+=('&' if '?' in url else '?')+urlencode({'audience':audience})
          with urlopen(Request(url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=25) as r:
              token=json.load(r)['value']
          sources=sorted(Path('mobile/store/screenshots/android').glob('*.png'))
          accepted=[]
          for f in sources:
              idx=int(f.name[:2])
              body={'platform':'android','index':idx,'file':f.name,'png_base64':base64.b64encode(f.read_bytes()).decode('ascii')}
              req=Request(audience+'/apps/automation/vice-codes-screenshot/',data=json.dumps(body).encode(),method='POST',headers={
                  'Content-Type':'application/json','Accept':'application/json',
                  'User-Agent':'Mozilla/5.0 (compatible; APlusPublisher/1.0)',
                  'X-GitHub-OIDC':token})
              try:
                  with urlopen(req,timeout=90) as response: result=json.load(response)
              except HTTPError as exc:
                  raise SystemExit('Publisher rejected '+f.name+': HTTP '+str(exc.code)+' '+exc.read(1200).decode('utf-8','replace')) from None
              if not result.get('ok'): raise SystemExit('Store screenshot not accepted: '+str(result))
              accepted.append({'source':f.name,'asset_id':result['asset_id'],'reused':result.get('reused')})
          print(json.dumps({'accepted':accepted},indent=2))
          if len(accepted)<3: raise SystemExit('Missing Android store screenshot artifacts')
          PY

  ios-ipad-13:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select actual 13-inch iPad simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json,subprocess
          info=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=[d for family in info['devices'].values() for d in family if d.get('isAvailable')]
          candidates=[d for d in devices if 'iPad' in d['name'] and ('13-inch' in d['name'] or '12.9-inch' in d['name'])]
          if not candidates:
              raise SystemExit('No real iPad 13-inch or 12.9-inch simulator available on this Mac runner')
          candidates.sort(key=lambda d: ('13-inch' not in d['name'], 'Pro' not in d['name'],d['name']))
          print('IPAD_UDID='+candidates[0]['udid'])
          print('IPAD_NAME='+candidates[0]['name'])
          PY
      - name: Build and capture actual native iPad 13-inch app UI
        working-directory: mobile
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org=de.smarbiz --project-name=vicecodes .
          flutter pub get
          flutter build ios --simulator --debug --dart-define=VICE_CAPTURE_TAB=0
          xcrun simctl boot "$IPAD_UDID" || true
          xcrun simctl bootstatus "$IPAD_UDID" -b
          xcrun simctl status_bar "$IPAD_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$IPAD_UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$IPAD_UDID" de.smarbiz.vicecodes
          sleep 12
          mkdir -p store/screenshots/ios
          xcrun simctl io "$IPAD_UDID" screenshot store/screenshots/ios/04-ipad-13-cheats.png
          sips -g pixelWidth -g pixelHeight store/screenshots/ios/04-ipad-13-cheats.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          f=Path("store/screenshots/ios/04-ipad-13-cheats.png")
          b=f.read_bytes()
          w,h=struct.unpack('>II',b[16:24])
          if (w,h) not in {(2048,2732),(2064,2752)}:
              raise SystemExit("iPad screenshot has unsupported actual dimensions: "+str((w,h)))
          print("Real Apple iPad simulator screenshot:",w,h,len(b))
          PY
      - name: Save real iPad screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-ipad-13-real-screenshot
          path: mobile/store/screenshots/ios/04-ipad-13-cheats.png
          if-no-files-found: error
          retention-days: 14
      - name: Import 13-inch iPad screenshot into Publisher via scoped GitHub OIDC
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError
          root='https://publisher.smarbiz.sbs'
          src=Path('mobile/store/screenshots/ios/04-ipad-13-cheats.png')
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url+=('&' if '?' in url else '?')+urlencode({'audience':root})
          with urlopen(Request(url,headers={
              'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          }),timeout=25) as r: token=json.load(r)['value']
          body={
              'platform':'ios','index':4,'file':src.name,
              'device_type':'APP_IPAD_PRO_3GEN_129',
              'png_base64':base64.b64encode(src.read_bytes()).decode(),
          }
          req=Request(root+'/apps/automation/vice-codes-screenshot/',
              data=json.dumps(body).encode(),method='POST',headers={
                  'Content-Type':'application/json','Accept':'application/json',
                  'User-Agent':'Mozilla/5.0 (compatible; APlusPublisher/1.0)',
                  'X-GitHub-OIDC':token,
              })
          try:
              with urlopen(req,timeout=90) as r: response=json.load(r)
          except HTTPError as exc:
              raise SystemExit('iPad screenshot import failed: HTTP '+str(exc.code)+' '+exc.read(1300).decode('utf-8','replace')) from None
          if not response.get('ok'): raise SystemExit('iPad screenshot was not accepted: '+str(response))
          print(json.dumps(response,indent=2))
          PY

