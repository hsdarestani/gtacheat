name: Vice Codes — Build via A+ Publisher
# iOS signing retry: Runner-only provisioning profile; no profile on Swift packages.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      build_number:
        description: "Positive build number"
        required: true
        default: "1"
      platforms:
        description: "Build target (iOS requires linked Apple signing)"
        required: true
        type: choice
        options:
          - android
          - ios
          - both
        default: android
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-release.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: vice-codes-publisher-build
  cancel-in-progress: false

jobs:
  request-publisher-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Publisher health
        run: curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 6 --max-time 20 https://publisher.smarbiz.sbs/healthz/

      - name: Request signed native build via GitHub OIDC
        env:
          PUBLISHER_ENDPOINT: https://publisher.smarbiz.sbs/apps/automation/release/
          SOURCE_COMMIT: ${{ github.sha }}
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          APP_BUILD_NUMBER: ${{ inputs.build_number || '1' }}
          APP_PLATFORMS: ${{ inputs.platforms || 'ios' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          version = os.environ["APP_VERSION_NAME"].strip()
          build = int(os.environ["APP_BUILD_NUMBER"])
          requested = os.environ["APP_PLATFORMS"].strip()
          if build < 1 or requested not in {"android", "ios", "both"}:
              raise SystemExit("Invalid version/build target")
          platforms = ["android", "ios"] if requested == "both" else [requested]
          audience = "https://publisher.smarbiz.sbs"
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in oidc_url else "?"
          oidc_url += sep + urlencode({"audience": audience})
          request = Request(oidc_url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urlopen(request, timeout=25) as response:
              identity_token = json.load(response)["value"]
          payload = {
              "app_identifier": "de.smarbiz.vicecodes",
              "version_name": version,
              "build_number": build,
              "source_branch": "main",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "platforms": platforms,
              "android_track": "internal",
              "auto_submit": False,
              "release_notes": "Erste Version des deutschsprachigen GTA VI Fan-Guides",
          }
          req = Request(os.environ["PUBLISHER_ENDPOINT"],
              data=json.dumps(payload).encode("utf-8"), method="POST",
              headers={"Content-Type": "application/json", "Accept": "application/json",
                       "User-Agent": "Mozilla/5.0 (compatible; APlusPublisher/1.0)",
                       "X-GitHub-OIDC": identity_token})
          try:
              with urlopen(req, timeout=90) as response:
                  result = json.load(response)
          except HTTPError as e:
              detail = e.read(1600).decode("utf-8", "replace")
              raise SystemExit("Publisher rejected request (HTTP %s): %s" % (e.code, detail)) from None
          if not result.get("ok"):
              raise SystemExit("Publisher did not confirm build request: " + str(result))
          print(json.dumps({
              "app": result.get("app"),
              "release_id": result.get("release_id"),
              "release_url": audience + str(result.get("release_url", "")),
              "queued": result.get("queued"),
              "skipped": result.get("skipped"),
              "auto_submit": False
          }, ensure_ascii=False, indent=2))
          PY
