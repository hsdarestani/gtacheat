name: Vice Codes mobile validation
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_flutter_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native project
        working-directory: mobile
        run: flutter create --platforms=android,ios --org=de.smarbiz --project-name=vicecodes .
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Check iOS and Android build shell syntax
        working-directory: mobile
        run: |
          bash -n scripts/build-ios.sh
          bash -n scripts/build-android.sh
          python3 -m py_compile scripts/patch-ios-team.py
          python3 scripts/test-ios-patch.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path("scripts/build-ios.sh").read_text()
          assert 'archive \\\n  CODE_SIGNING_ALLOWED=YES' in s, "Xcode archive signing flags must be in the same shell command"
          assert 'PROVISIONING_PROFILE_SPECIFIER=$IOS_PROVISIONING_PROFILE_SPECIFIER"' not in s, "Do not globally provision Swift packages"
          PY
      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze
      - name: Test offline database and interactions
        working-directory: mobile
        run: flutter test
      - name: Generate original launch assets
        working-directory: mobile
        run: python3 scripts/create-icons.py
      - name: Android debug smoke-build (no publishing)
        working-directory: mobile
        run: flutter build apk --debug
      - name: Upload Android test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload original app icon
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vice-codes-store-icon
          path: mobile/store/icon-1024.png
          retention-days: 7
          if-no-files-found: error
