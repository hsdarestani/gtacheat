name: Vice Codes — Official App Store and Google Play submission
# Explicit owner-requested submission: Publisher gates per-platform public review and Google production promotion.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect official store records or upload only to TestFlight / Google internal"
        type: choice
        options:
          - preflight
          - upload_test
          - status
          - submit_public
        required: true
        default: preflight
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-store.yml"

permissions:
  contents: read
  id-token: write

jobs:
  store-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check Publisher health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 4 --max-time 20 https://publisher.smarbiz.sbs/healthz/
      - name: Submit verified Vice Codes app to App Review and Google Play production
        env:
          STORE_MODE: ${{ inputs.mode || 'status' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          mode = os.environ["STORE_MODE"]
          if mode not in {"preflight", "upload_test", "status", "submit_public"}:
              raise SystemExit("Invalid store mode")
          audience = "https://publisher.smarbiz.sbs"
          oidc = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in oidc else "?"
          request = Request(oidc + sep + urlencode({"audience": audience}), headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
          })
          with urlopen(request, timeout=25) as response:
              jwt_token = json.load(response)["value"]
          body = {"mode": mode, "app_identifier": "de.smarbiz.vicecodes"}
          endpoint = audience + "/apps/automation/vice-codes-store/"
          req = Request(endpoint, data=json.dumps(body).encode("utf-8"), method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 (compatible; APlusPublisher/1.0)",
                  "X-GitHub-OIDC": jwt_token,
              })
          try:
              with urlopen(req, timeout=160) as res:
                  out = json.load(res)
          except HTTPError as exc:
              raise SystemExit("Publisher store handoff HTTP %s: %s" % (
                  exc.code, exc.read(1800).decode("utf-8", "replace"))) from None
          print(json.dumps(out, ensure_ascii=False, indent=2))
          if not out.get("ok"):
              raise SystemExit("Publisher did not acknowledge store handoff")
          PY
